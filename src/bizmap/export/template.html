<title>__TITLE__</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --soft: #f6f8fa; --chip: #eaeef2;
    --accent: #0969da; --risk: #cf222e; --read: #1a7f37; --readbg: #dafbe1; --write: #a40e26; --writebg: #ffebe9;
    --sel: #ddf4ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px; color: var(--fg); background: var(--bg);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  #app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  header { grid-column: 1 / 4; display: flex; gap: 12px; align-items: center; padding: 8px 12px;
           border-bottom: 1px solid var(--line); background: var(--soft); }
  header .brand { font-weight: 700; white-space: nowrap; }
  #crumbs { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #crumbs a { color: var(--fg); }
  #crumbs .sep { margin: 0 6px; color: var(--muted); }
  .search { position: relative; }
  #q { width: 320px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #results { position: absolute; right: 0; top: 34px; width: 520px; max-height: 70vh; overflow: auto; z-index: 20;
             background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12); display: none; }
  #results .r { display: flex; gap: 8px; padding: 5px 8px; cursor: pointer; align-items: baseline; }
  #results .r:hover, #results .r.on { background: var(--chip); }
  #results .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav#toc { grid-row: 2; overflow: auto; border-right: 1px solid var(--line); padding: 10px 0; background: var(--soft); }
  nav#toc h4 { margin: 12px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  nav#toc a { display: flex; gap: 6px; padding: 3px 12px; color: var(--fg); border-left: 3px solid transparent; }
  nav#toc a:hover { background: var(--chip); text-decoration: none; }
  nav#toc a.on { border-left-color: var(--accent); background: var(--sel); }
  nav#toc a .n { margin-left: auto; color: var(--muted); font-size: 11px; }
  nav#toc a.sub { padding-left: 26px; }
  nav#toc a.warn { color: var(--risk); }
  main#read { grid-row: 2; overflow: auto; padding: 16px 22px 60px; }
  main h1 { font-size: 20px; margin: 0 0 4px; word-break: break-word; }
  main h2 { font-size: 14px; margin: 22px 0 8px; }
  main .lead { color: var(--muted); margin: 0 0 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 4px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .card .stats { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; white-space: nowrap; font-weight: normal; }
  table.list { border-collapse: collapse; width: 100%; }
  table.list th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                  border-bottom: 1px solid var(--line); padding: 6px 8px; position: sticky; top: -16px; background: var(--bg); }
  table.list td { border-bottom: 1px solid var(--chip); padding: 5px 8px; vertical-align: top; }
  table.list tr.row { cursor: pointer; }
  table.list tr.row:hover td { background: var(--soft); }
  table.list tr.on td { background: var(--sel); }
  table.list.fixed { table-layout: fixed; }
  table.list tr.group td { background: var(--soft); font-weight: 600; padding-top: 10px; }
  table.list td.screen { font-weight: 600; color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  table.list td.routes .chip { margin: 2px 6px 2px 0; }
  td.num, th.num { text-align: right; white-space: nowrap; color: var(--muted); }
  .m { display: inline-block; min-width: 52px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; }
  .m.GET { color: #0550ae; } .m.POST { color: #1a7f37; } .m.PUT, .m.PATCH { color: #9a6700; } .m.DELETE { color: #cf222e; }
  .pp { color: #8250df; }
  .chip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; background: var(--chip); white-space: nowrap; }
  .chip.r { background: var(--readbg); color: var(--read); } .chip.w { background: var(--writebg); color: var(--write); }
  .chip.rw { background: linear-gradient(90deg, var(--readbg) 50%, var(--writebg) 50%); color: var(--fg); }
  .chip.http { background: #ddf4ff; color: #0550ae; }
  .chip.guess { background: #fff; border: 1px dashed #54aeff; }
  td.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  code.wrap { word-break: break-all; } .chip.bad { background: #fff8c5; color: #9a6700; }
  .eps { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ep { border-top: 1px solid var(--chip); }
  .ep:first-child { border-top: 0; }
  .ep-head { display: flex; gap: 10px; align-items: baseline; padding: 9px 12px; cursor: pointer; }
  .ep-head:hover { background: var(--soft); }
  .ep.open > .ep-head { background: var(--sel); }
  .ep-path { font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  .ep-sum { color: var(--muted); margin-left: auto; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ep-body { padding: 4px 16px 14px 74px; background: var(--soft); border-top: 1px solid var(--chip); }
  .ep-body h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  .ep-desc { margin: 10px 0 0; white-space: pre-wrap; }
  table.params td { padding: 3px 14px 3px 0; vertical-align: top; }
  .pname, .fname { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .req { color: var(--risk); margin-left: 2px; }
  .schema-box { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin: 6px 0 10px; overflow: hidden; }
  .schema-tabs { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--chip); background: var(--soft); }
  .schema-name { font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 600; margin-right: auto; }
  .stab { font-size: 12px; padding: 2px 10px; border-radius: 12px; }
  .stab.on { background: var(--sel); border-color: var(--accent); }
  pre.json { margin: 0; padding: 10px 12px; font-size: 12px; line-height: 1.55; overflow-x: auto; background: #f6f8fa; }
  .jk { color: #0550ae; } .js { color: #0a3069; } .jnum { color: #953800; } .jb, .jn { color: #8250df; } .jp { color: #6e7781; }
  table.fields { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.fields th { text-align: left; font-size: 11px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--chip); }
  table.fields td { padding: 4px 8px; border-bottom: 1px solid var(--chip); vertical-align: top; }
  table.fields td.ftype { font-family: ui-monospace, Menlo, monospace; color: #8250df; white-space: nowrap; }
  .resp { margin: 4px 0; }
  .rcode { display: inline-block; min-width: 38px; text-align: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px; border-radius: 4px; background: var(--chip); }
  .rcode.ok { background: var(--readbg); color: var(--read); } .rcode.bad { background: var(--writebg); color: var(--write); }
  .chip.screen { background: #fbefff; color: #6639ba; font-size: 12px; padding: 1px 8px; }
  .ep-data a { font-weight: 600; }
  .small { font-size: 12px; }
  .ep-group { padding: 6px 12px; background: var(--soft); font-weight: 600; font-size: 12px; border-top: 1px solid var(--chip); }
  .ep-group:first-child { border-top: 0; }
  .ep.use .ep-who { padding: 0 12px 8px 74px; font-size: 12px; }
  .ep.use.guess .ep-head .ep-path { border-bottom: 1px dashed #54aeff; }
  details.more { margin-top: 22px; } details.more > summary { cursor: pointer; color: var(--accent); }
  .code-btn { font-size: 12px; }
  .tree { margin: 6px 0 10px; }
  .tree .node { display: flex; gap: 6px; align-items: baseline; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .tree .node:hover { background: var(--soft); }
  .tree .node.on { background: var(--sel); }
  .tree .tog { width: 14px; color: var(--muted); flex: none; text-align: center; }
  .tree .kids { margin-left: 16px; border-left: 1px dotted var(--line); padding-left: 4px; }
  .tree .dir { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .tree .seen { color: var(--muted); font-style: italic; }
  aside#detail { grid-row: 2; overflow: auto; border-left: 1px solid var(--line); padding: 14px; }
  aside h2 { font-size: 15px; margin: 0 0 4px; word-break: break-all; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 3px 0; border-bottom: 1px solid var(--chip); word-break: break-word; }
  .ev { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .why { background: var(--soft); border-left: 3px solid var(--accent); padding: 6px 8px; margin: 8px 0; white-space: pre-wrap;
         max-height: 220px; overflow: auto; }
  .muted { color: var(--muted); } .risk { color: var(--risk); font-weight: 600; }
  .empty { color: var(--muted); padding: 20px 0; }
  .filter { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; width: 260px; margin: 0 0 10px; }
  #map { height: calc(100vh - 160px); border: 1px solid var(--line); border-radius: 8px; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 12px; }
  .tabs a { padding: 3px 10px; border: 1px solid var(--line); border-radius: 12px; color: var(--fg); }
  .tabs a.on { background: var(--sel); border-color: var(--accent); }
</style>
