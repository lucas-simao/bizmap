id: pgx.v5.sql
language: go
framework: pgx
description: >
  pgx v5, database/sql, and sqlx raw SQL. The engine picks the argument
  that is a SQL literal or const (database/sql Exec(sql), pgx Exec(ctx, sql),
  ExecContext/QueryContext/QueryRowContext, sqlx Get/Select/NamedExec).
status: active
when:
  imports:
    contains: github.com/jackc/pgx
    optional: true
detect:
  calls:
    method:
      regex: "^(Exec|Query|QueryRow|ExecContext|QueryContext|QueryRowContext|Get|Select|NamedExec|NamedQuery|MustExec|Queryx|QueryRowx)$"
    arguments:
      sql:
        index: 1
        capture: string_or_ident
produce:
  sql:
    dialect: postgres
    source: "{sql}"
    caller: "{enclosing_function}"
