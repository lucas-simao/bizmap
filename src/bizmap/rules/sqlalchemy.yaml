id: sqlalchemy.sql
language: python
framework: sqlalchemy
description: >
  SQLAlchemy Core text() / execute() SQL strings, plus ORM/Core usage
  (select/insert/update/delete, session.add/query) handled by the Python engine.
status: active
when:
  imports:
    contains: sqlalchemy
    optional: true
detect:
  calls:
    method:
      in: [text, execute]
    arguments:
      sql:
        index: 0
        capture: string_or_ident
produce:
  sql:
    dialect: postgres
    source: "{sql}"
    caller: "{enclosing_function}"
