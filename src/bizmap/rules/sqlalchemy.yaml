# Example / v0.2-oriented rule. v0.1 implements `text()` and `execute()` SQL
# string capture when this file is active; ORM mapper/relationship models are
# not yet understood (see roadmap).
id: sqlalchemy.sql
language: python
framework: sqlalchemy
description: >
  SQLAlchemy Core text() / execute() SQL strings. Community can extend this
  YAML with additional call patterns (session.execute, op.execute, etc.)
  without changing BizMap source.
status: active
when:
  imports:
    contains: sqlalchemy
    optional: true
detect:
  calls:
    method:
      in: [text, execute]
    arguments:
      sql:
        index: 0
        capture: string_or_ident
produce:
  sql:
    dialect: postgres
    source: "{sql}"
    caller: "{enclosing_function}"
