id: express.routes
language: javascript
framework: express
description: Express HTTP routes (app.get("/path", handler)) plus fetch() and supabase.rpc.
status: active
when:
  imports:
    contains: express
    optional: true
detect:
  calls:
    method:
      in: [get, post, put, patch, delete, use, all]
    arguments:
      path:
        index: 0
        capture: string
      handler:
        index: -1
        capture: ident_or_function
produce:
  entrypoint:
    kind: http
    method: "{method}"
    path: "{path}"
    handler: "{handler}"
