id: fastapi.routes
language: python
framework: fastapi
description: >
  FastAPI HTTP routes (@app.get, @router.post) including APIRouter(prefix=)
  and app.include_router(..., prefix=). Paths resolve module/imported constants,
  concatenation, and f-strings.
status: active
when:
  imports:
    contains: fastapi
    optional: true
detect:
  decorators:
    method:
      in: [get, post, put, patch, delete, options, head]
    arguments:
      path:
        index: 0
        capture: string
produce:
  entrypoint:
    kind: http
    method: "{decorator.method}"
    path: "{path}"
    handler: "{function}"
