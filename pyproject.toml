[project]
name = "bizmap"
version = "0.15.1"
description = "Deterministic business-rule and data-lineage mapper for codebases. No AI, no tokens, no accounts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "BizMap contributors" }]
keywords = ["lineage", "data-lineage", "business-rules", "sql", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bizmap = "bizmap.cli:main"

[project.urls]
Homepage = "https://github.com/lucas-simao/bizmap"
Issues = "https://github.com/lucas-simao/bizmap/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# the GIFs/PNGs are for the README (absolute URLs) and the docs site, not the package
exclude = ["docs/assets", "docs/img"]

[tool.hatch.build.targets.wheel.force-include]
"src/bizmap/rules/celery.yaml" = "bizmap/rules/celery.yaml"
"src/bizmap/rules/echo.yaml" = "bizmap/rules/echo.yaml"
"src/bizmap/rules/express.yaml" = "bizmap/rules/express.yaml"
"src/bizmap/rules/fastapi.yaml" = "bizmap/rules/fastapi.yaml"
"src/bizmap/rules/firebase.yaml" = "bizmap/rules/firebase.yaml"
"src/bizmap/rules/flask.yaml" = "bizmap/rules/flask.yaml"
"src/bizmap/rules/go_ticker.yaml" = "bizmap/rules/go_ticker.yaml"
"src/bizmap/rules/httpx.yaml" = "bizmap/rules/httpx.yaml"
"src/bizmap/rules/pgx.yaml" = "bizmap/rules/pgx.yaml"
"src/bizmap/rules/sqlalchemy.yaml" = "bizmap/rules/sqlalchemy.yaml"
"src/bizmap/rules/supabase.yaml" = "bizmap/rules/supabase.yaml"
"src/bizmap/export/template.html" = "bizmap/export/template.html"
"src/bizmap/export/book.js" = "bizmap/export/book.js"
"src/bizmap/export/home.js" = "bizmap/export/home.js"
"src/bizmap/export/query.js" = "bizmap/export/query.js"
"src/bizmap/export/vendor/cytoscape.min.js" = "bizmap/export/vendor/cytoscape.min.js"
"src/bizmap/export/vendor/cytoscape.LICENSE" = "bizmap/export/vendor/cytoscape.LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not perf and not browser'"
markers = [
    "perf: scale/performance checks (slow; run with `pytest -m perf`)",
    "browser: the exported HTML in a real browser (Playwright + Chromium; run with `pytest -m browser`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
