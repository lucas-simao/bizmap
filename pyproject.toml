[project]
name = "bizmap"
version = "0.1.0"
description = "Deterministic business-rule and data-lineage mapper for codebases. No AI, no tokens, no accounts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "BizMap contributors" }]
keywords = ["lineage", "data-lineage", "business-rules", "sql", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bizmap = "bizmap.cli:main"

[project.urls]
Homepage = "https://github.com/lucas-simao/bizmap"
Issues = "https://github.com/lucas-simao/bizmap/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/bizmap/rules" = "bizmap/rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
