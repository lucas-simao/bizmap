name: BizMap impact
description: Comment on a pull request with the entrypoints and tables/columns its changed functions reach.
branding:
  icon: git-pull-request
  color: orange
inputs:
  path:
    description: Directory to scan, relative to the repository root (a bizmap.yaml with `repos:` scans a monorepo jointly).
    default: "."
  config:
    description: Optional path to bizmap.yaml.
    default: ""
  comment:
    description: Post (or update) the PR comment. "false" only writes the step summary.
    default: "true"
  comment-author:
    description: Login that owns the comment to update (the token's user). Comments by anyone else are never edited.
    default: github-actions[bot]
  max-rows:
    description: Max functions listed in the comment (the step summary lists all).
    default: "50"
  fail-on-error:
    description: Fail the job when BizMap itself fails (the check is advisory by default; the comment always says it failed).
    default: "false"
  python-version:
    description: Python used to run BizMap.
    default: "3.12"
  github-token:
    description: "Token for the comment (needs `pull-requests: write`)."
    default: ${{ github.token }}
outputs:
  markdown:
    description: Path of the Markdown written to the PR comment.
    value: ${{ steps.impact.outputs.markdown }}
  status:
    description: ok, skipped or failed.
    value: ${{ steps.impact.outputs.status }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Scan and map the diff
      id: impact
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        CONFIG: ${{ inputs.config }}
        MAX_ROWS: ${{ inputs.max-rows }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/bizmap"
        mkdir -p "$out"
        comment="$out/comment.md"
        echo "markdown=$comment" >> "$GITHUB_OUTPUT"
        marker='<!-- bizmap-impact -->'
        finish() {  # status, message
          if [ "$1" != ok ]; then
            printf '%s\n### BizMap impact\n\n%s ([log](%s))\n' "$marker" "$2" "$RUN_URL" > "$comment"
            cat "$comment" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$1" >> "$GITHUB_OUTPUT"
          exit 0
        }
        if ! python -m pip install --quiet "$GITHUB_ACTION_PATH"; then
          echo "::error::could not install BizMap"
          finish failed "Failed: BizMap could not be installed."
        fi
        if [ -z "${BASE_SHA:-}" ]; then
          echo "::warning::bizmap-impact only runs on pull_request events (no base commit here)."
          finish skipped "Skipped: not a pull_request event."
        fi
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "::error::could not fetch the base commit $BASE_SHA. Use actions/checkout with fetch-depth: 0."
            finish failed "Failed: base commit \`$BASE_SHA\` is not available (use \`fetch-depth: 0\`)."
          fi
        fi
        # Diff against what the PR changes, in the code being scanned (HEAD):
        # - default checkout (the PR merge commit, first parent = base): base..HEAD;
        # - `ref: <head>` checkout: merge-base..HEAD, so base-branch drift is not
        #   reported as the PR's change.
        from="$BASE_SHA"
        if [ "$(git rev-parse -q --verify 'HEAD^1' 2>/dev/null)" != "$BASE_SHA" ]; then
          mb="$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)"
          if [ -z "$mb" ]; then
            git fetch --no-tags --deepen=200 origin "$BASE_SHA" >/dev/null 2>&1 || true
            mb="$(git merge-base "$BASE_SHA" HEAD 2>/dev/null || true)"
          fi
          if [ -z "$mb" ]; then
            echo "::error::no merge base between $BASE_SHA and HEAD; use actions/checkout with fetch-depth: 0."
            finish failed "Failed: no merge base with the base branch (use \`fetch-depth: 0\`)."
          fi
          from="$mb"
        fi
        # quotepath=false keeps non-ASCII paths readable.
        if ! git -c core.quotepath=false diff --no-color --no-ext-diff --unified=0 "$from" HEAD > "$out/pr.diff"; then
          echo "::error::git diff failed"
          finish failed "Failed: \`git diff\` against the base failed."
        fi
        args=()
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        if ! bizmap scan "$SCAN_PATH" "${args[@]}" --out "$out/graph.json"; then
          echo "::error::bizmap scan failed"
          finish failed "Failed: \`bizmap scan\` did not finish."
        fi
        common=(--graph "$out/graph.json" --diff "$out/pr.diff" --prefix "$SCAN_PATH" --repo-root .)
        if ! bizmap impact "${common[@]}" --max-rows 100000 --max-chars 900000 > "$out/full.md" \
          || ! bizmap impact "${common[@]}" --max-rows "$MAX_ROWS" --details-url "$RUN_URL" > "$comment"; then
          echo "::error::bizmap impact failed"
          finish failed "Failed: \`bizmap impact\` did not finish."
        fi
        cat "$out/full.md" >> "$GITHUB_STEP_SUMMARY"
        finish ok ""
    - name: Comment on the PR
      if: always() && inputs.comment == 'true' && github.event.pull_request.number && steps.impact.outputs.status != 'skipped'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        AUTHOR: ${{ inputs.comment-author }}
        BODY_FILE: ${{ steps.impact.outputs.markdown }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        if [ "$HEAD_REPO" != "$REPO" ]; then
          echo "::notice::PR from a fork: the token is read-only, so the impact is only in the step summary."
          exit 0
        fi
        marker='<!-- bizmap-impact -->'
        body="${BODY_FILE:-}"
        if [ -z "$body" ] || [ ! -s "$body" ]; then
          # an earlier step (setup-python, the scan step itself) died before writing a report
          body="$RUNNER_TEMP/bizmap-failed.md"
          printf '%s\n### BizMap impact\n\nFailed before a report was written ([log](%s)).\n' "$marker" "$RUN_URL" > "$body"
        fi
        if ! listing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.user.login == \"$AUTHOR\" and (.body | startswith(\"$marker\"))) | .id")"; then
          echo "::warning::could not list PR comments (permissions or rate limit); not posting, to avoid a duplicate."
          exit 0
        fi
        id="$(printf '%s\n' "$listing" | head -n1)"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null \
            || echo "::warning::could not update the comment (does the token have pull-requests: write?)"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null \
            || echo "::warning::could not post the comment (does the token have pull-requests: write?)"
        fi
    - name: Report a BizMap failure
      if: always() && (steps.impact.outputs.status == 'failed' || steps.impact.outcome == 'failure')
      shell: bash
      env:
        FAIL: ${{ inputs.fail-on-error }}
      run: |
        if [ "$FAIL" = "true" ]; then
          echo "::error::BizMap impact failed; see the steps above."
          exit 1
        fi
        echo "::warning::BizMap impact failed (advisory; set fail-on-error: true to fail the job)."
