name: BizMap impact
description: Comment on a pull request with the entrypoints and tables/columns its changed functions reach.
branding:
  icon: git-pull-request
  color: orange
inputs:
  path:
    description: Directory to scan, relative to the repository root (a bizmap.yaml with `repos:` scans a monorepo jointly).
    default: "."
  config:
    description: Optional path to bizmap.yaml.
    default: ""
  comment:
    description: Post (or update) the PR comment. Set to "false" to only write the step summary.
    default: "true"
  python-version:
    description: Python used to run BizMap.
    default: "3.12"
  github-token:
    description: Token for the comment (needs `pull-requests: write`).
    default: ${{ github.token }}
outputs:
  markdown:
    description: Path of the generated Markdown report.
    value: ${{ steps.impact.outputs.markdown }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install BizMap
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Scan and map the diff
      id: impact
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        CONFIG: ${{ inputs.config }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/bizmap"
        mkdir -p "$out"
        if [ -z "${BASE_SHA:-}" ]; then
          echo "::warning::bizmap-impact runs on pull_request events; no base commit here."
          BASE_SHA="$(git rev-parse HEAD~1)"
        fi
        git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
        # HEAD is what actions/checkout checked out (the PR merge commit), so the
        # diff line numbers match the code being scanned.
        git diff --unified=0 "$BASE_SHA" HEAD > "$out/pr.diff"
        args=()
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        bizmap scan "$SCAN_PATH" "${args[@]}" --out "$out/graph.json"
        bizmap impact --graph "$out/graph.json" --diff "$out/pr.diff" --prefix "$SCAN_PATH" > "$out/impact.md"
        cat "$out/impact.md" >> "$GITHUB_STEP_SUMMARY"
        echo "markdown=$out/impact.md" >> "$GITHUB_OUTPUT"
    - name: Comment on the PR
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BODY_FILE: ${{ steps.impact.outputs.markdown }}
      run: |
        set -euo pipefail
        marker='<!-- bizmap-impact -->'
        id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" | head -n1)"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$BODY_FILE" > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$BODY_FILE" > /dev/null
        fi
