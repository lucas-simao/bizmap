# Dogfood: runs the BizMap impact Action from this checkout on this repo's PRs.
name: Impact
on: pull_request
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: bizmap-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: .
  # The PR head checked out directly (shallow): exercises the merge-base path
  # (base-branch drift must not count as the PR's change). Summary only.
  impact-head-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./
        id: bizmap
        with:
          path: .
          comment: "false"
          html: out/bizmap.html
      - name: The report and the graph page were produced
        env:
          STATUS: ${{ steps.bizmap.outputs.status }}
          HTML: ${{ steps.bizmap.outputs.html }}
        run: |
          test "$STATUS" = ok
          test "$HTML" = "$GITHUB_WORKSPACE/out/bizmap.html"
          test -s "$HTML" && grep -q '<html' "$HTML"
