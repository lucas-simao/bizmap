# Publish to PyPI when a version tag is pushed (Trusted Publishing, no token).
#
# One-time setup on PyPI (project "bizmap" → Publishing → Add a trusted publisher,
# or "pending publisher" before the first upload):
#   owner: lucas-simao · repository: bizmap · workflow: release.yml · environment: pypi
# And on GitHub: Settings → Environments → New environment "pypi"
# (optionally with required reviewers, so each publish waits for approval).
#
# GitHub runs the workflow file of the tagged commit, so tags on commits older
# than this file (v0.3.3–v0.3.5) don't trigger it by push. Publish those with
# Actions → Release → "Run workflow" and the tag name: this file (from main)
# checks out and builds that tag.
#
# A manual run can be started from any branch, and its jobs use that branch's
# copy of this file. Only `main` (dispatch) and `v*` tags may publish: the
# `publish` job checks it, and the `pypi` environment should also be limited to
# them (Settings → Environments → pypi → Deployment branches and tags: `main`
# and tag pattern `v*`).
#
# Third-party actions are pinned by commit SHA (comment = version).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.3.5)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag is a version tag on main, matching the package and the CHANGELOG
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::'$TAG' is not a version tag (vX.Y.Z)"; exit 1 ;; esac
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG does not exist"; exit 1; }
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          tag="${TAG#v}"
          version="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
          grep -qF "## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
      - name: Test before publishing
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bizmap/
    permissions:
      id-token: write   # Trusted Publishing (OIDC); no API token stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="## $version " 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
