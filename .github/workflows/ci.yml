name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Non-editable install
        run: |
          pip install .
          bizmap --version
      - name: Smoke-test report on examples
        run: |
          bizmap report examples/shop
          bizmap report examples/pyplatform
          bizmap report examples/clinic --redact --salt ci
      - name: Checkout demo (README)
        run: |
          bizmap scan examples/checkout --mermaid --out /tmp/checkout.json
          cat /tmp/checkout*.mmd
          bizmap why orders.status --graph /tmp/checkout.json
          bizmap report examples/checkout
      - name: Export the checkout demo to HTML (packaged assets)
        run: |
          bizmap export --graph /tmp/checkout.json --format html --out /tmp/checkout.html
          test "$(grep -c 'Cytoscape Consortium' /tmp/checkout.html)" -ge 1
      - name: TEMP snapshot diff
        continue-on-error: true
        run: |
          pip install pytest
          BIZMAP_UPDATE_SNAPSHOTS=1 pytest -q tests/test_snapshots.py tests/test_py_scale.py -k "example_snapshot or golden" || true
          git diff --stat tests/snapshots; git diff tests/snapshots > /tmp/snap.patch; echo "PATCH_BEGIN"; gzip -c /tmp/snap.patch | base64 -w0; echo; echo "PATCH_END"
      - name: Go phase scaling (informational)
        run: |
          python scripts/bench_go.py 500 1000 2000 4000
          python scripts/bench_go.py 1000 4000 --heavy --all-files
          python scripts/bench_go.py --client 800
          python scripts/bench_js.py 1000 2000 4000
          python scripts/bench_py.py 150 300
      - name: Performance checks (pytest -m perf)
        run: pip install pytest && pytest -q -s -m perf
      - name: Scale benchmark (informational)
        run: python scripts/bench_scale.py 500:150 1000:300 2000:600 && python scripts/bench_scale.py 2000:600 --profile
      - name: Impact of a synthetic diff (PR-comment Action)
        run: |
          printf '%s\n' 'diff --git a/examples/checkout/api/billing.go b/examples/checkout/api/billing.go' \
            '--- a/examples/checkout/api/billing.go' '+++ b/examples/checkout/api/billing.go' \
            '@@ -27,1 +27,1 @@' '-old' '+new' > /tmp/pr.diff
          bizmap impact --graph /tmp/checkout.json --diff /tmp/pr.diff --prefix examples/checkout | tee /tmp/impact.md
          grep -q "CreateInvoice" /tmp/impact.md
